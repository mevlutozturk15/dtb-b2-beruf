  for(const x of candidates){if(choices.length>=4)break; if(!choices.some(y=>(state.mode==="tr-de"?y.de:y.tr)===(state.mode==="tr-de"?x.de:x.tr)))choices.push(x)}
  shuffle(choices);
  $("options").innerHTML=choices.map((x,i)=>`<button class="option" data-de="${esc(x.de)}">${esc(state.mode==="tr-de"?x.de:x.tr)}</button>`).join("");
  document.querySelectorAll(".option").forEach(b=>b.onclick=()=>answer(b,item));
}
function answer(btn,item){
  if(state.answered)return;
  state.answered=true;
  const correct=state.mode==="tr-de"?item.de:item.tr;
  document.querySelectorAll(".option").forEach(b=>{b.classList.add("disabled");if(b.textContent===correct)b.classList.add("correct")});
  if(btn.textContent===correct){btn.classList.add("correct");state.ok++;$("feedback").className="feedback good";$("feedback").textContent="✓ Doğru!"}
  else{btn.classList.add("wrong");state.bad++;$("feedback").className="feedback bad";$("feedback").textContent=`✗ Yanlış. Doğru cevap: ${correct}`}
  $("ok").textContent=state.ok;$("bad").textContent=state.bad;save();
}
$("next").onclick=()=>{if(!state.pool.length)return;state.index=(state.index+1)%state.pool.length;show()};
$("shuffle").onclick=()=>{shuffle(state.pool);state.index=0;show()};
$("mode").onclick=()=>{state.mode=state.mode==="tr-de"?"de-tr":"tr-de";$("mode").textContent=state.mode==="tr-de"?"Türkçe → Almanca":"Almanca → Türkçe";show()};
$("hint").onclick=()=>{const item=state.pool[state.index];const answer=state.mode==="tr-de"?item.de:item.tr;const hint=state.mode==="tr-de"?answer[0]+"…":"…"+answer.slice(-3);$("feedback").className="feedback";$("feedback").textContent="💡 İpucu: "+hint};
$("search").oninput=e=>{state.search=e.target.value;state.index=0;buildPool(false)};
$("reset").onclick=()=>{state.ok=0;state.bad=0;save();$("ok").textContent=0;$("bad").textContent=0;toast("İstatistikler sıfırlandı.")};
document.addEventListener("keydown",e=>{if(e.key==="Enter")$("next").click(); if(e.key==="1")document.querySelectorAll(".option")[0]?.click();if(e.key==="2")document.querySelectorAll(".option")[1]?.click();if(e.key==="3")document.querySelectorAll(".option")[2]?.click();if(e.key==="4")document.querySelectorAll(".option")[3]?.click()});
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
$("ok").textContent=state.ok;$("bad").textContent=state.bad;renderCats();buildPool(true);
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
